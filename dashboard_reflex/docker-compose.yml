services:
  app:
    build:
      context: ..                # Go up to project root (artguide/)
      dockerfile: dashboard_reflex/Dockerfile
      args:
        DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-http://localhost:8502}
    container_name: artguide-dashboard
    ports:
      - "127.0.0.1:8502:8502"
    restart: always
    # Keep a bounded history instead of docker's unbounded default, so logs from
    # before a crash are still there when you go looking.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
